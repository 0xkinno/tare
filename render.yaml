# Keeper and recorder as a Render background worker in Singapore (the data API refuses US regions).
services:
  - type: worker
    name: tare-keeper
    runtime: node
    region: singapore
    plan: starter
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile
    startCommand: pnpm exec tsx services/keeper/src/index.ts
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BSC_RPC_URL
        sync: false
      - key: NEXT_PUBLIC_TAREBOOK
        sync: false
      - key: NEXT_PUBLIC_REGISTRY
        sync: false
      - key: KEEPER_PRIVATE_KEY
        sync: false
      - key: BINANCE_WEB3_API_KEY
        sync: false
      - key: BINANCE_WEB3_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PUBLIC_WEB_ORIGIN
        value: https://tare-olive.vercel.app
      - key: PORT
        value: 8787
