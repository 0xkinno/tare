name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and check the hosted keeper
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://tare-keeper.onrender.com/healthz || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
