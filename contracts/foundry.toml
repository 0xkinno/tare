[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "../data" }, { access = "read", path = "script" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 8
depth = 12
fail_on_revert = false
